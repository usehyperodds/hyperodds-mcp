name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The build job runs the repository's and the dependencies' code with a token that can only read.
# The publish job holds write access and the OIDC token npm takes in place of a stored one (trusted
# publishing, set up for this workflow on npmjs.com), and runs nothing from the repository: it
# publishes what the build job packed.
jobs:
  build:
    name: test and pack the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: pack the npm package, the Claude Desktop extension and the release notes
        run: |
          mkdir release
          npm pack --pack-destination release
          node scripts/mcpb.mjs release/hyperodds.mcpb
          # The tag's own entry, wherever it sits below [Unreleased].
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md \
            > release/notes.md
          test -s release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm with provenance, and release on GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # No registry-url: it would write an .npmrc with a placeholder token, which npm falls back to
      # when the OIDC exchange fails, and the publish then fails as a 404 instead of saying why.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm 11.5.1 or later, the first to publish with an OIDC token
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@11.21.3 --ignore-scripts
          fi
          npm --version
      - name: attest that the extension was built here, from this tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/hyperodds.mcpb
      # Publishing and the release skip what an earlier run of this tag did, so a failed run can be re-run.
      - name: publish to npm, unless this version is already there
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@hyperodds/mcp@$version" version > /dev/null 2>&1; then
            echo "@hyperodds/mcp@$version is already on npm."
          elif ! npm publish "./release/hyperodds-mcp-$version.tgz" --provenance --access public --ignore-scripts; then
            # npm logs the OIDC exchange's answer at verbose level only, so it is in the debug log.
            grep -h -i oidc ~/.npm/_logs/*-debug-0.log || true
            exit 1
          fi
      - name: GitHub release from the changelog entry, with the extension and its SHA-256
        run: |
          sha=$(sha256sum release/hyperodds.mcpb | cut -d ' ' -f 1)
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf '\n`hyperodds.mcpb` SHA-256: `%s`. To verify that GitHub Actions built it in this repository, run\n`gh attestation verify hyperodds.mcpb --repo %s`.\n' \
            "$sha" "$GITHUB_REPOSITORY" >> release/notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/hyperodds.mcpb --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release/notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/hyperodds.mcpb --title "$GITHUB_REF_NAME" \
              --notes-file release/notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
