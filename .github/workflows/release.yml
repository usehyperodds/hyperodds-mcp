name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: pack the Claude Desktop extension
        run: node scripts/mcpb.mjs build/hyperodds.mcpb
      - name: attest that the extension was built here, from this tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/hyperodds.mcpb
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release from the changelog entry, with the extension and its SHA-256
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          sha=$(sha256sum build/hyperodds.mcpb | cut -d ' ' -f 1)
          printf '\n`hyperodds.mcpb` SHA-256: `%s`. To verify that GitHub Actions built it in this repository, run\n`gh attestation verify hyperodds.mcpb --repo %s`.\n' \
            "$sha" "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$GITHUB_REF_NAME" build/hyperodds.mcpb --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
